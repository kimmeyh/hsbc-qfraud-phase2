# Minimal CI (F16, card #52).
#
# WHY THIS EXISTS. Sprint 8 shipped a bug where RUNNING THE TEST SUITE
# overwrote experiments/results/ieee_classical.json -- the full 590,537-row,
# 3-fold run that every reported IEEE figure traces to -- with a 1-fold smoke
# result. It was caught from `git status` by luck, not by any check. The
# dirty-tree gate below is the tripwire for that class of defect: a test that
# modifies tracked files is a defect whether or not its assertions pass.
#
# Runs from a CLEAN CHECKOUT with no raw datasets, no rendered PDFs and no QCi
# credentials. Tests that need those SKIP rather than fail (they carry
# skipif guards), so a red build here always means a real regression.
name: CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# TWO JOBS (Sprint 30 Task L, team lead D9, 2026-11-01: "find what does not
# need to be in there and remove it ... Target is < 5 minutes").
#
#   test  every pull request push, draft or not. Every test except the red
#         proofs (`-m "not proof and not slow"`), then the diff-coverage
#         refusal gate. A red proof breaks a guarded file and reruns the
#         guard's test in a nested pytest, which was most of the
#         suite's time. It proves the guard CAN fail, which changes only
#         when the guard or its test changes, so it does not need every push.
#         It ran on drafts only until PR 92's review: then a push after
#         ready for review, the HEAD that is merged, skipped the gate.
#   full  whenever the PR is not a draft (marked ready for review, and every
#         push after that), and on demand (workflow_dispatch). Every
#         non-proof test, then the red proofs of the files the branch
#         changed plus a rotating 5% sample (Sprint 31 D17), so a commit
#         pushed after ready for review still runs them (PR 74 review).
#         `check_ci_status.py --require-job full` reads it at Phase 7.
#
# `conftest.py` marks a proof from its source, so a new proof leaves the
# push job and stays in the full job with nothing to remember.
# `test_ci_workflow.py` fails if either job's selection changes.
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # 10 until Sprint 30, then 20, then 13 (D9). Without the proofs the
    # job took 3:08 on 0fc2004 (tests 2:04, install 0:46); 6 stops a hung
    # run with margin for a slow runner. 12 from Sprint 31 (F177 change c):
    # measuring coverage slows the tests; the first measured run sets it.
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # diff-cover compares with origin/develop

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r experiments/requirements.txt
          pip install ruff

      # Lint is advisory: a style warning must not block a submission fix five
      # days from the deadline. Failures are visible in the log and in the step
      # summary without failing the build.
      - name: Lint (advisory)
        continue-on-error: true
        run: ruff check experiments/src scripts || true

      # `slow` is the live-pipeline test, which needs the raw IEEE-CIS data
      # CI does not have. `--durations` prints the slowest tests, so the
      # next cut is chosen from CI's own times.
      # COVERAGE_PROCESS_START makes every Python process measure itself
      # (.coveragerc, F177 change c), the tests' subprocesses included.
      - name: Tests
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/.coveragerc
          COVERAGE_DATA_DIR: ${{ github.workspace }}
        run: pytest -m "not proof and not slow" -q --durations=25

      # F78, Sprint 16. Until this step existed, every guard in this
      # repository was WINDOWS-ONLY protection: the hooks were PowerShell and
      # this runner is ubuntu-latest, so none of them had ever executed here.
      #
      # The suite above proves the hooks pass their tests. This proves one
      # actually FIRES on Linux, which is a different claim: a hook that loads
      # and returns 0 passes every test that only checks it does not crash.
      - name: A guard must FIRE on Linux, not merely load
        run: |
          set -e
          payload='{"tool_name":"Bash","tool_input":{"command":"git stash push -m x"}}'
          set +e
          echo "$payload" | python .claude/hooks/block_carry_forward_stash.py
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            echo "::error::The carry-forward guard did not block on Linux."
            echo "::error::Expected exit 2, got $rc. A guard that does not fire"
            echo "::error::is indistinguishable from no guard at all."
            exit 1
          fi
          echo "Guard fired correctly on Linux (exit 2)."

          # And the other direction: a read must still be allowed, or the
          # guard blocks correct work and gets switched off.
          allowed='{"tool_name":"Bash","tool_input":{"command":"git stash list"}}'
          set +e
          echo "$allowed" | python .claude/hooks/block_carry_forward_stash.py
          rc2=$?
          set -e
          if [ "$rc2" -ne 0 ]; then
            echo "::error::The guard blocked a READ (git stash list) on Linux."
            echo "::error::Expected exit 0, got $rc2."
            exit 1
          fi
          echo "Read correctly allowed on Linux (exit 0)."

      # THE POINT OF THIS WORKFLOW. If the suite modified any tracked file, the
      # build fails and names the files. Sprint 8's evidence-overwrite bug
      # would have failed here on the PR that introduced it.
      - name: Test run must leave the tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The test run modified tracked files. A test that"
            echo "::error::writes to the repository is a defect even when its"
            echo "::error::assertions pass -- Sprint 8 lost an evidence file"
            echo "::error::exactly this way. Files changed:"
            git status --porcelain
            git diff --stat
            exit 1
          fi
          echo "Working tree clean after the test run."

      # F177 change c (Sprint 31 D8), narrowed by D16 option 1: a changed
      # REFUSAL line (raise, a one-line `if bad: raise`, sys.exit,
      # SystemExit, print("REFUSING ...")) in the evidence code, the
      # scripts or the hooks that no test ran fails the job; every other
      # untested changed line is listed and does not fail. Untested
      # refusals are the class the check exists for (37 reached review in
      # Sprints 28-30); every changed line failed on every experiment
      # module's data-only paths. It runs LAST, so its red cannot skip the
      # guard and clean-tree steps above (it did on d2cb10a).
      - name: Diff coverage
        run: |
          coverage combine --keep -q
          coverage xml -q -o coverage.xml
          diff-cover coverage.xml --compare-branch=origin/develop --format json:diff-cover.json --include 'experiments/src/*.py' 'experiments/phase2/src/*.py' 'scripts/*.py' '.claude/hooks/*.py'
          python scripts/refusal_coverage.py diff-cover.json

  full:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # The whole suite took about 12 minutes in one job before Task L.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # select_proofs.py compares with origin/develop

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r experiments/requirements.txt

      # The junit reports give F180's inventory its per-file CI times
      # (Sprint 31 Task B); they are uploaded even when a test fails. They
      # are written outside the checkout, so the clean-tree step still holds.
      - name: Tests
        run: pytest -m "not proof and not slow" -q --durations=25 --junitxml=${{ runner.temp }}/ci-full.xml

      # Sprint 31 D17 option 1 (c): the red proofs of the files this branch
      # changed (own test, named file), plus this sprint's 5% rotating
      # sample, so every proof file runs at least once in 20 sprints. A
      # proof tests its test, so it shows nothing new unless its files
      # changed; all 58 proof files took 4 hours locally.
      - name: Red proofs, selected and sampled
        if: success() || failure()
        run: python scripts/select_proofs.py --sample --run -- --junitxml=${{ runner.temp }}/ci-proofs.xml

      - name: Keep the junit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-full-junit
          path: ${{ runner.temp }}/ci-*.xml

      # A red proof breaks a file and restores it; this catches one that
      # did not restore.
      - name: Test run must leave the tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The test run modified tracked files:"
            git status --porcelain
            git diff --stat
            exit 1
          fi
          echo "Working tree clean after the test run."
